[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-agent-exchange"
version = "0.1.0"
description = "Shared Bitcoin specialist forecasts, risk controls and paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "python-dotenv>=1.1,<2"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
macro = ["yfinance>=1.8,<2"]
specialists = [
    "pydantic>=2.14,<3", "google-genai>=3,<4", "langchain-core>=1.7,<2",
    "python-dotenv>=1.1,<2", "yfinance>=1.8,<2", "tzdata>=2025.2",
]
live = ["python-socketio[client]>=5,<6", "websocket-client>=1.8,<2", "truststore>=0.10,<1"]
# Optional SDK integrations; the dashboard's lightweight provider clients use specialists.
google-client = ["langchain-google-genai>=4.4,<5"]
anthropic-client = ["langchain-anthropic"]
openai-client = ["langchain-openai"]
bedrock-client = ["langchain-aws"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/pharos-MIT.txt"]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build*", "tests*", "examples*"]
include = ["verification*", "dashboard*", "agents*", "market_data*", "features*", "model_clients*", "exchange*", "risk*", "execution*", "experiments*"]
namespaces = false

[tool.setuptools.package-data]
dashboard = ["*.html", "*.css", "*.js"]
"agents.specialists.prompts" = ["*.txt"]
"market_data.stablecoin" = ["fixtures/*.json"]
"market_data.prediction_markets" = ["fixtures/*.json"]
verification = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py311"]
