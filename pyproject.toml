[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-agent-exchange"
version = "0.1.0"
description = "Shared Bitcoin specialist forecasts, risk controls and paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]
macro = ["yfinance>=1.8,<2"]
specialists = [
    "pydantic>=2.14,<3", "google-genai>=3,<4", "langchain-core>=1.7,<2",
    "python-dotenv>=1.1,<2", "yfinance>=1.8,<2", "tzdata>=2025.2",
]
live = ["python-socketio[client]>=5,<6", "truststore>=0.10,<1"]
student4-integration = ["pandas>=2,<4"]
# Legacy extras remain accepted; the shared project uses Python 3.11+.
student2 = [
    "pydantic>=2.14,<3",
    "google-genai>=3,<4",
    "langchain-core>=1.7,<2",
    "python-dotenv>=1.1,<2",
    "yfinance>=1.8,<2",
    "tzdata>=2025.2",
]
student2-test = ["pytest>=9,<10"]
student2-live = ["python-socketio[client]>=5,<6", "truststore>=0.10,<1"]
student2-google = ["langchain-google-genai>=4.4,<5"]
student2-anthropic = ["langchain-anthropic"]
student2-openai = ["langchain-openai"]
student2-aws = ["langchain-aws"]

[tool.setuptools]
license-files = ["licenses/pharos-MIT.txt"]

[tool.setuptools.package-dir]
student2 = "compat/student2"
student4 = "compat/student4"
crypto_trading = "compat/crypto_trading"
tradingagents = "compat/tradingagents"
macro = "compat/macro"

[tool.setuptools.packages.find]
where = [".", "compat"]
exclude = ["compat*", "build*"]
include = ["verification*", "dashboard*", "agents*", "market_data*", "features*", "model_clients*", "exchange*", "risk*", "execution*", "experiments*", "crypto_trading*", "student4*", "student2*", "macro*", "tradingagents*"]
namespaces = true

[tool.setuptools.package-data]
dashboard = ["*.html", "*.css", "*.js"]
"agents.specialists.prompts" = ["*.txt"]
"market_data.stablecoin" = ["fixtures/*.json"]
"market_data.prediction_markets" = ["fixtures/*.json"]
verification = ["*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "compat"]
