[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdp-bitcoin-agent-system"
version = "0.1.0"
description = "Bitcoin agent experiments, specialist signals, and paper trading components"
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
news-live = ["google-genai>=1.0"]
test = ["pytest>=8.0"]

[tool.setuptools]
license-files = ["licenses/pharos-MIT.txt"]

[tool.setuptools.packages.find]
include = ["crypto_trading*"]

[tool.setuptools.package-data]
"crypto_trading.stablecoin" = ["fixtures/*.json"]
"crypto_trading.agents.prompts" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
