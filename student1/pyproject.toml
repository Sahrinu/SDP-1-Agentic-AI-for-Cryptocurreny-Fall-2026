[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student1-bitcoin-agents"
version = "0.1.0"
description = "Student 1 Bitcoin price data, Chart agent, and Long-term agent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"crypto_trading.agents.prompts" = ["*.txt"]

